name: Forge Mobile Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/ForgeMobile/**'
      - '.github/workflows/android-editor.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore project
        run: dotnet restore src/ForgeMobile/ForgeMobile.csproj
      - name: Build release APK
        run: >-
          dotnet publish src/ForgeMobile/ForgeMobile.csproj
          --configuration Release
          --framework net9.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidSupportedAbis=arm64-v8a
          --output artifacts/apk
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find artifacts/apk -maxdepth 2 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/ForgeMobile.apk
          ls -lh output/ForgeMobile.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeMobile-Android-APK
          path: output/ForgeMobile.apk
          if-no-files-found: error
          retention-days: 14
