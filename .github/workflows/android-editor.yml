name: Clear Game Engine Android APK and AAB

on:
  push:
    branches: [ main ]
    paths:
      - 'src/ForgeMobile/**'
      - '.github/workflows/android-editor.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run engine smoke tests
        run: dotnet run --project src/ForgeMobile.Tests/ForgeMobile.Tests.csproj --configuration Release
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore project
        run: dotnet restore src/ForgeMobile/ForgeMobile.csproj
      - name: Build release APK
        run: >-
          dotnet publish src/ForgeMobile/ForgeMobile.csproj
          --configuration Release
          --framework net10.0-android
          -p:AndroidPackageFormat=apk
          --output artifacts/apk
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find artifacts/apk -maxdepth 2 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/ClearGameEngine.apk
          ls -lh output/ClearGameEngine.apk
      - name: Build Android App Bundle
        run: >-
          dotnet publish src/ForgeMobile/ForgeMobile.csproj
          --configuration Release
          --framework net10.0-android
          -p:AndroidPackageFormat=aab
          --output artifacts/aab
      - name: Locate AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find artifacts/aab -maxdepth 2 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          cp "$AAB" output/ClearGameEngine.aab
          ls -lh output/ClearGameEngine.aab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearGameEngine-Android-APK
          path: output/ClearGameEngine.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearGameEngine-Android-AAB
          path: output/ClearGameEngine.aab
          if-no-files-found: error
          retention-days: 14
